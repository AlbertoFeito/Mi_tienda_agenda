<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generador de licencias — NayadeStore</title>
<style>
  :root { --verde:#0F766E; --oscuro:#134E4A; --texto:#0F172A; --gris:#64748B; --borde:#E2E8F0; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background:#F1F5F9; color:var(--texto); }
  header { background:var(--oscuro); color:#fff; padding:16px; }
  header h1 { margin:0; font-size:18px; }
  header p { margin:4px 0 0; font-size:13px; opacity:.75; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  .caja { background:#fff; border:1px solid var(--borde); border-radius:12px; padding:16px; margin-bottom:16px; }
  label { display:block; font-size:13px; font-weight:600; color:var(--gris); margin-bottom:6px; }
  input { width:100%; height:48px; padding:0 12px; font-size:16px; border:1px solid var(--borde);
          border-radius:8px; outline:none; font-family:ui-monospace, monospace; letter-spacing:1px; }
  input:focus { border-color:var(--verde); }
  button { width:100%; height:48px; border:0; border-radius:10px; background:var(--verde); color:#fff;
           font-size:16px; font-weight:600; margin-top:12px; cursor:pointer; }
  button:active { transform:scale(.98); }
  button.sec { background:#fff; color:var(--verde); border:2px solid var(--verde); }
  .resultado { background:#F0FDFA; border:1px solid #99F6E4; border-radius:10px; padding:14px; margin-top:14px; }
  .resultado .etiqueta { font-size:12px; color:var(--gris); }
  .resultado .codigo { font-family:ui-monospace, monospace; font-size:24px; font-weight:700;
                       letter-spacing:2px; word-break:break-all; margin:2px 0 0; }
  .aviso { background:#FEF3C7; border:1px solid #FDE68A; color:#92400E; border-radius:10px;
           padding:12px; font-size:13px; margin-bottom:16px; }
  .peligro { background:#FEE2E2; border-color:#FECACA; color:#991B1B; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--borde); }
  th { color:var(--gris); font-size:12px; }
  td.mono { font-family:ui-monospace, monospace; }
  .vacio { color:var(--gris); font-size:13px; text-align:center; padding:16px 0; }
  .fila { display:flex; gap:8px; }
  .fila button { flex:1; }
</style>
</head>
<body>

<header>
  <h1>Generador de licencias</h1>
  <p>Funciona sin internet. No compartas este archivo.</p>
</header>

<main>
  <div class="aviso peligro" id="avisoSecreto" hidden>
    Falta tu secreto. Sin él, las licencias que generes no abrirán ninguna app.
  </div>

  <div class="caja">
    <label for="secreto">Tu secreto (el mismo con el que se compiló el APK)</label>
    <input id="secreto" type="password" placeholder="pégalo aquí" autocomplete="off">
    <div class="fila">
      <button class="sec" id="verSecreto" type="button">Ver</button>
      <button class="sec" id="guardarSecreto" type="button">Recordar</button>
    </div>
  </div>

  <div class="caja">
    <label for="equipo">Código del teléfono del cliente</label>
    <input id="equipo" placeholder="B587X-7WC16" autocapitalize="characters" spellcheck="false">
    <label for="nombre" style="margin-top:14px">Nombre del cliente (opcional, para tu registro)</label>
    <input id="nombre" placeholder="Yeni" style="font-family:inherit; letter-spacing:normal">
    <button id="generar" type="button">Generar licencia</button>

    <div class="resultado" id="resultado" hidden>
      <p class="etiqueta">Licencia para este teléfono</p>
      <p class="codigo" id="licencia"></p>
      <button class="sec" id="copiar" type="button">Copiar</button>
    </div>
  </div>

  <div class="caja">
    <label>Licencias que has entregado</label>
    <table>
      <thead><tr><th>Cliente</th><th>Equipo</th><th>Licencia</th><th>Fecha</th></tr></thead>
      <tbody id="registro"></tbody>
    </table>
    <p class="vacio" id="sinRegistro">Todavía no has generado ninguna.</p>
    <button class="sec" id="exportar" type="button">Exportar registro</button>
  </div>
</main>

<script id="core">
/* ------------------------------------------------------------------ *
 * Mismo algoritmo que la app y que scripts/generar-licencia.mjs.
 * SHA-256 y HMAC van escritos a mano para que este archivo funcione
 * abierto directamente desde el teléfono, sin internet ni permisos.
 * ------------------------------------------------------------------ */
var ALFABETO = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';
var LICENCIA_CHARS = 16;

var K = [
  0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
  0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
  0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
  0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
  0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
  0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
  0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
  0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
];

function rotr(x, n) { return (x >>> n) | (x << (32 - n)); }

function sha256(bytes) {
  var h = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  var lenBits = bytes.length * 8;
  var withPad = new Uint8Array((((bytes.length + 9) + 63) >> 6) << 6);
  withPad.set(bytes);
  withPad[bytes.length] = 0x80;
  // Longitud en bits, big-endian, en los últimos 8 bytes.
  var hi = Math.floor(lenBits / 0x100000000);
  var lo = lenBits >>> 0;
  var end = withPad.length;
  withPad[end - 8] = (hi >>> 24) & 0xff; withPad[end - 7] = (hi >>> 16) & 0xff;
  withPad[end - 6] = (hi >>> 8) & 0xff;  withPad[end - 5] = hi & 0xff;
  withPad[end - 4] = (lo >>> 24) & 0xff; withPad[end - 3] = (lo >>> 16) & 0xff;
  withPad[end - 2] = (lo >>> 8) & 0xff;  withPad[end - 1] = lo & 0xff;

  var w = new Array(64);
  for (var i = 0; i < withPad.length; i += 64) {
    for (var t = 0; t < 16; t++) {
      w[t] = (withPad[i + t * 4] << 24) | (withPad[i + t * 4 + 1] << 16) |
             (withPad[i + t * 4 + 2] << 8) | withPad[i + t * 4 + 3];
    }
    for (t = 16; t < 64; t++) {
      var s0 = rotr(w[t - 15], 7) ^ rotr(w[t - 15], 18) ^ (w[t - 15] >>> 3);
      var s1 = rotr(w[t - 2], 17) ^ rotr(w[t - 2], 19) ^ (w[t - 2] >>> 10);
      w[t] = (w[t - 16] + s0 + w[t - 7] + s1) | 0;
    }
    var a = h[0], b = h[1], c = h[2], d = h[3], e = h[4], f = h[5], g = h[6], hh = h[7];
    for (t = 0; t < 64; t++) {
      var S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
      var ch = (e & f) ^ (~e & g);
      var t1 = (hh + S1 + ch + K[t] + w[t]) | 0;
      var S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
      var maj = (a & b) ^ (a & c) ^ (b & c);
      var t2 = (S0 + maj) | 0;
      hh = g; g = f; f = e; e = (d + t1) | 0;
      d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    h[0] = (h[0] + a) | 0; h[1] = (h[1] + b) | 0; h[2] = (h[2] + c) | 0; h[3] = (h[3] + d) | 0;
    h[4] = (h[4] + e) | 0; h[5] = (h[5] + f) | 0; h[6] = (h[6] + g) | 0; h[7] = (h[7] + hh) | 0;
  }
  var out = new Uint8Array(32);
  for (var j = 0; j < 8; j++) {
    out[j * 4] = (h[j] >>> 24) & 0xff; out[j * 4 + 1] = (h[j] >>> 16) & 0xff;
    out[j * 4 + 2] = (h[j] >>> 8) & 0xff; out[j * 4 + 3] = h[j] & 0xff;
  }
  return out;
}

function utf8(str) {
  var out = [];
  for (var i = 0; i < str.length; i++) {
    var c = str.charCodeAt(i);
    if (c < 0x80) out.push(c);
    else if (c < 0x800) { out.push(0xc0 | (c >> 6), 0x80 | (c & 63)); }
    else if (c < 0xd800 || c >= 0xe000) { out.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63)); }
    else { i++; var cp = 0x10000 + (((c & 0x3ff) << 10) | (str.charCodeAt(i) & 0x3ff));
           out.push(0xf0 | (cp >> 18), 0x80 | ((cp >> 12) & 63), 0x80 | ((cp >> 6) & 63), 0x80 | (cp & 63)); }
  }
  return new Uint8Array(out);
}

function concat(a, b) {
  var r = new Uint8Array(a.length + b.length);
  r.set(a); r.set(b, a.length);
  return r;
}

function hmacSha256(keyBytes, msgBytes) {
  var block = 64;
  var k = keyBytes.length > block ? sha256(keyBytes) : keyBytes;
  var padded = new Uint8Array(block);
  padded.set(k);
  var iKey = new Uint8Array(block), oKey = new Uint8Array(block);
  for (var i = 0; i < block; i++) { iKey[i] = padded[i] ^ 0x36; oKey[i] = padded[i] ^ 0x5c; }
  return sha256(concat(oKey, sha256(concat(iKey, msgBytes))));
}

function toBase32(bytes, length) {
  var bits = 0, value = 0, out = '';
  for (var i = 0; i < bytes.length; i++) {
    value = ((value << 8) | bytes[i]) >>> 0;
    bits += 8;
    while (bits >= 5) {
      out += ALFABETO[(value >>> (bits - 5)) & 31];
      bits -= 5;
      value = value & ((1 << bits) - 1);
      if (out.length === length) return out;
    }
  }
  while (out.length < length) out += ALFABETO[0];
  return out;
}

function normalizar(raw) {
  return (raw || '').toUpperCase().replace(/[^0-9A-Z]/g, '').replace(/[IL]/g, '1').replace(/O/g, '0');
}

function agrupar(code, size) {
  return (code.match(new RegExp('.{1,' + size + '}', 'g')) || []).join('-');
}

function calcularLicencia(equipo, secreto) {
  var digest = hmacSha256(utf8(secreto), utf8('nayadestore:v1:' + normalizar(equipo)));
  return toBase32(digest, LICENCIA_CHARS);
}

if (typeof module !== 'undefined') {
  module.exports = { calcularLicencia: calcularLicencia, normalizar: normalizar, agrupar: agrupar };
}
</script>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var CLAVE_SECRETO = 'nayade_secreto';
  var CLAVE_REGISTRO = 'nayade_licencias';

  var secretoGuardado = localStorage.getItem(CLAVE_SECRETO);
  if (secretoGuardado) $('secreto').value = secretoGuardado;

  function revisarSecreto() {
    $('avisoSecreto').hidden = $('secreto').value.trim().length > 0;
  }
  revisarSecreto();
  $('secreto').addEventListener('input', revisarSecreto);

  $('verSecreto').onclick = function () {
    var c = $('secreto');
    c.type = c.type === 'password' ? 'text' : 'password';
    this.textContent = c.type === 'password' ? 'Ver' : 'Ocultar';
  };

  $('guardarSecreto').onclick = function () {
    localStorage.setItem(CLAVE_SECRETO, $('secreto').value.trim());
    this.textContent = 'Guardado';
    var b = this;
    setTimeout(function () { b.textContent = 'Recordar'; }, 1500);
  };

  function leerRegistro() {
    try { return JSON.parse(localStorage.getItem(CLAVE_REGISTRO)) || []; } catch (e) { return []; }
  }

  function pintarRegistro() {
    var filas = leerRegistro();
    var tbody = $('registro');
    tbody.innerHTML = '';
    $('sinRegistro').hidden = filas.length > 0;
    filas.slice().reverse().forEach(function (f) {
      var tr = document.createElement('tr');
      tr.innerHTML = '<td>' + (f.nombre || '—') + '</td>' +
                     '<td class="mono">' + f.equipo + '</td>' +
                     '<td class="mono">' + f.licencia + '</td>' +
                     '<td>' + f.fecha + '</td>';
      tbody.appendChild(tr);
    });
  }
  pintarRegistro();

  $('generar').onclick = function () {
    var secreto = $('secreto').value.trim();
    var equipo = normalizar($('equipo').value);
    if (!secreto) { alert('Falta tu secreto.'); return; }
    if (equipo.length !== 10) { alert('El código del teléfono debe tener 10 caracteres.'); return; }

    var licencia = agrupar(calcularLicencia(equipo, secreto), 4);
    $('licencia').textContent = licencia;
    $('resultado').hidden = false;

    var registro = leerRegistro();
    registro.push({
      nombre: $('nombre').value.trim(),
      equipo: agrupar(equipo, 5),
      licencia: licencia,
      fecha: new Date().toLocaleDateString('es-CU')
    });
    localStorage.setItem(CLAVE_REGISTRO, JSON.stringify(registro));
    pintarRegistro();
  };

  $('copiar').onclick = function () {
    var texto = $('licencia').textContent;
    if (navigator.clipboard) {
      navigator.clipboard.writeText(texto).then(function () {
        $('copiar').textContent = 'Copiado';
        setTimeout(function () { $('copiar').textContent = 'Copiar'; }, 1500);
      });
    } else {
      prompt('Copia la licencia:', texto);
    }
  };

  $('exportar').onclick = function () {
    var filas = leerRegistro();
    if (!filas.length) { alert('No hay nada que exportar.'); return; }
    var texto = filas.map(function (f) {
      return [f.fecha, f.nombre || '-', f.equipo, f.licencia].join('\t');
    }).join('\n');
    var blob = new Blob(['Fecha\tCliente\tEquipo\tLicencia\n' + texto], { type: 'text/plain' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'licencias-entregadas.txt';
    a.click();
  };
})();
</script>

</body>
</html>
